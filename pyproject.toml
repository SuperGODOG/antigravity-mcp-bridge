[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-mcp-bridge"
version = "0.1.0"
description = "Universal MCP daemon and resilient orchestration bridge for Google Antigravity (agy)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Antigravity Bridge Contributors" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "antigravity",
    "agy",
    "claude",
    "codex",
    "chatgpt",
    "ai-agent",
    "orchestrator"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
antigravity-mcp-bridge = "agy_mcp_bridge.cli:main"
agy-mcp-server = "agy_mcp_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
